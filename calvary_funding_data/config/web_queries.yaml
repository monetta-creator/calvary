# Recipient alias regexes (case-insensitive). "House of Ruth" without "Maryland" is read as House of Ruth (DC).
recipients:
  calvary: "Calvary Women.?s Services|Calvary Women.?s\\b|Calvary Womens"
  nsv: "N Street Village"
  hor_dc: "^(The )?House of Ruth(?!,? (Maryland|MD))(, Inc\\.?)?$|House of Ruth \\(DC\\)|House of Ruth DC"
  openarms: "Open Arms Housing"
  nebw: "New Endeavors [Bb]y Women"
  dash: "District Alliance for Safe Housing|^DASH$"
  msp: "My Sisters?.?s? Place(?! of)"
  dcsafe: "^DC SAFE|^D\\.C\\. SAFE|Survivors and Advocates for Empowerment"
  samaritan: "Samaritan Inns|^Nuvaya"
  christhouse: "^Christ House"
  everyonehome: "Everyone Home DC|^Everyone Home$"
  cfh: "^(DC |D\\.C\\. |The )?Coalition for the Homeless(, Inc\\.?)?$"
  thrive: "^Thrive DC"
  miriams: "Miriam.?s Kitchen"
  coh: "^Community of Hope(, Inc\\.?)?$"
  chdc: "Covenant House (Washington|Greater Washington|DC|D\\.C\\.)"
  doorways: "Doorways for Women (and|&) Families|^Doorways$"
  hor_md: "House of Ruth,? Maryland|House of Ruth \\(MD\\)"
  heartly: "Heartly House"

# Per-page parse specs, keyed by page id (pages are listed under peers/funders above).
# year = the year the list describes (gift year or grant year); year_basis stays report_year unless a grant
# date is parsed (then award_year).
page_parse:
  # ---------- peers (entries are funders; recipient = the peer)
  nsv_ar_fy25:
    year: 2025
    parse:
      - type: layout_columns
        start: "Annual Donor List July 1, 2024"
        end: "RECURRING DONORS|^\\s*Board of Directors\\s*$"
        skip: "Annual Donor List|^\\d+$|N Street Village|Thank you|nstreetvillage"
        section_re: "IN-KIND GIFTS"
        section: "Annual Donor List July 1, 2024 - June 30, 2025"
        note: "FY25 donor list (gifts July 2024-June 2025)"
  nsv_ar_fy24:
    year: 2024
    parse:
      - type: layout_columns
        start: "Thank you for supporting our Village"
        end: "Board\\s*of Directors|2024-2025 Board"
        skip: "who donated|Thank you|generous donors|ListedListed|here are those|^\\d+$|N Street Village"
        section: "FY24 donors of $500 or more"
        note: "FY24 donor list (FY July 2023-June 2024)"
  hordc_ar_2025:
    year: 2024
    parse:
      - type: layout_columns
        start: "^OUR FAMILY"
        end: "Board of Directors\\s+Senior Leadership"
        skip: "OF DONORS|gratefully recognizes|received January|cumulative giving|listed in this report|to all our donors|make our impact|Members of our monthly|Program are denoted|Board of Directors are|italics|every effort|accuracy of this|Emily Gjovik|houseofruth.org if|Annual Report 2025|^\\d+$|in memory of|honoring|In honor"
        section_re: "^Special Thanks$"
        section: "Our Family of Donors (cumulative gifts Jan 1-Dec 31, 2024, $1,000+)"
        note: "2025 annual report donor list covers gifts Jan-Dec 2024"
  msp_impact_fy23:
    year: 2023
    parse:
      - type: layout_columns
        start: "FY23 corporate support"
        end: "FY2023 IMPACT REPORT"
        skip: "FY23 Revenue|Amerigroup.s generous gift|our new administrative|acedc.org|^\\d+%?$|fy2\\d|In FY2022|second shelter"
        section_re: "FY23 (corporate|FOUNDATION) support"
        section: "FY23 corporate and foundation support"
        note: "FY23 impact report (most recent posted); no amounts except where stated"
      - type: explicit
        rows:
          - {name: "Amerigroup", amount: 55000, year: 2023, verify: "Amerigroup.s generous gift of \\$55,000 funded the completion of", purpose: "new administrative office and Fresh Start Fund", note: "amount stated by the recipient"}
  coh_funders:
    year: 2024
    parse:
      - type: lines
        start: "^Other Partners$"
        end: "^Community Support$"
        band_re: "^(Hope Givers|Healers|Home Builders|Other Partners)$"
        section_re: "^Corporate Partners, Churches, and other Significant Supporters$"
        skip: "^Download|^Contact Us"
        note: "'most recent published list of top supporters' (tiers Hope Givers/Healers/Home Builders, no $ ranges); same list as the FY2024 Impact Report"
  cfh_ar_2025:
    year: 2025
    parse:
      - type: layout_columns
        start: "^\\s*Businesses\\s*$"
        end: "An Unforgettable EVENING"
        skip: "COALITION FOR THE HOMELESS$|Thank You FOR YOUR SUPPORT|ANNUAL REPORT|^\\d+$|Luxury Game Day Package|donation in honor|of Elizabeth"
        section_re: "^(Charitable Fund/Foundations|Government Agencies|Stepping Out For The Homeless|Sponsors)$"
        section: "Businesses"
        note: "2025 annual report supporter list"
  heartly_ar_fy25:
    year: 2025
    parse:
      - type: layout_columns
        start: "2024.2025"
        end: "LEADERSHIP TEAM"
        keep_bands: false
        skip: "CONNECT&THRIVE|Thank you to all|Please consider|to support our vital|work in the community|ONLINE GIVING|HEALING HEARTS|Join a community|businesses, and organizations committed|pledged to donate|^\\d+$"
        section: "2024-2025 donors (FY ending June 2025)"
        note: "mixed individual/organization list; bands not kept (layout too irregular to assign reliably)"
  dash_ar_2023:
    year: 2023
    parse:
      - type: explicit
        rows:
          - {name: "Amazon Housing Equity Fund", amount: 5000000, year: 2023, date: "6/1/2023", verify: "awarded\\s+a \\$5 million grant from the Amazon Housing Equity\\s+Fund in June 2023", purpose: "Journey Home campaign: Cornerstone building mortgage paydown and renovations", note: "amount stated by the recipient; one-time restricted grant; grant_date is the month stated (June 2023)"}
  ehdc_bezos:
    year: 2023
    parse:
      - type: explicit
        rows:
          - {name: "Bezos Day 1 Families Fund", amount: 2500000, year: 2023, verify: "receive a \\$2\\.5 million grant from the Bezos Day 1 Families Fund", purpose: "one-time flexible grant for family homelessness services (sixth annual Day 1 Families Fund round)", note: "post dated November 21, 2023; amount stated by the recipient"}
  ehdc_chcf:
    year: 2025
    parse:
      - type: explicit
        rows:
          - {name: "Capitol Hill Community Foundation", amount: 10000, year: 2025, verify: "Bill Phillips Grant for Social Services, a \\$10,000 award", purpose: "Bill Phillips Grant for Social Services (Fall 2025 cycle)", note: "post dated January 12, 2026"}
          - {name: "Capitol Hill Community Foundation", amount: 18000, year: 2026, amount_kind: pledge, verify: "We now budget \\$18,000 annually from the Capitol Hill Community Foundation", purpose: "recurring Spring/Fall grants: Street Outreach, Drop-In Day Center, Day Center Maintenance Fund", note: "budgeted annual amount stated by the recipient, not a confirmed award"}
  coh_5_5m:
    year: 2025
    parse:
      - type: explicit
        rows:
          - {name: "A. James & Alice B. Clark Foundation", amount: 4000000, year: 2025, verify: "\\$4 million investment from the A\\. James & Alice B\\. Clark Foundation", purpose: "Maternal and Child Health programs", note: "release dated March 31, 2025; amount stated by the recipient", cumulative: true}
          - {name: "The J. Willard and Alice S. Marriott Foundation", amount: 1000000, year: 2025, verify: "\\$1 million grant from The J\\. Willard and Alice S\\. Marriott Foundation", purpose: "Maternal and Child Health programs", note: "release dated March 31, 2025"}
          - {name: "Bedford Falls Foundation", amount: 1000000, year: 2025, amount_kind: pledge, verify: "\\$1 million commitment from the Bedford Falls Foundation", purpose: "Maternal and Child Health programs", note: "commitment; release says $500,000 of it is (text truncated in quote)"}
  hormd_honor_roll: {skip: "URL now serves the About Us page; no honor roll content"}
  hormd_ar_2024: {skip: "PDF returns HTTP 404"}
  hormd_ar_page: {skip: "annual report page has no donor list"}
