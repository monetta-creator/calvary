  # ---------- funders (entries are recipients)
  cafritz_recent:
    parse:
      - type: md_table
        cols: {purpose: 0, period: 1, area: 2, amount: 3}
        funder: "Morris and Gwendolyn Cafritz Foundation"
        heading: "Recent Grants (Summer 2025 - Spring 2026 cycles)"
        ambiguous: {msp: "listed as 'My Sisters Place (MSP)' linking to mspny.org; Cafritz funds the DC area only, read as My Sister's Place DC"}
        note: "grant amount and cycle as published by the funder; 412 rows (> 300), so only Calvary and core peers kept"
  graham_recent:
    parse:
      - type: records
        anchor: "\\d{1,2}/\\d{1,2}/20\\d\\d"
        fields: {name: -2, purpose: -1, date: 0, area: 1, location: 2, amount: 3}
        funder: "Philip L. Graham Fund"
        heading: "Recent Grants (past 36 months)"
        min_year: 2024
        whole_list: true
        note: "grant date and amount as published by the funder; 233 grants dated 2024-2026 (< 300): DC homelessness/DV/women grantees kept as well"
  gwcf_hef_partners:
    year: 2024
    parse:
      - type: blocks
        anchor: "^Which Communities/Neighborhoods do you serve"
