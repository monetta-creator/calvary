# Web queries and curated page lists for scripts 43-45 (Phase 4 web funder data).
# Tavily searches are cached by (id, query, params) in interim/web_fetch_manifest.csv; reruns reuse the
# saved raw response unless the script is run with --refresh.

calvary:
  searches:
    - id: cal_audit_fy24
      query: "Calvary Women's Services audited financial statements September 30 2024"
    - id: cal_audit_fy25
      query: "Calvary Women's Services financial statements September 30 2025 independent auditor's report"
    - id: cal_audit_fy22
      query: "Calvary Women's Services financial statements September 30 2022 single audit"
    - id: cal_ar_2024
      query: "Calvary Women's Services 2024 annual report"
    - id: cal_ar_2025
      query: "Calvary Women's Services 2025 annual report donors foundations"
    - id: cal_site_pdf
      query: "calvaryservices.org annual report audit pdf"
      params: {include_domains: [calvaryservices.org], max_results: 20}
    # Candid hosts Uniform Guidance (A-133) audit PDFs by EIN; the FY22 single audit was found this way
    - id: cal_candid_a133
      query: "Calvary Women's Services single audit financial statements"
      params: {include_domains: [docs.candid.org], max_results: 20}
    - id: cal_candid_a133_2024
      query: "CALVARY WOMEN'S SERVICES, INC. FINANCIAL STATEMENTS SEPTEMBER 30, 2024 AND 2023 schedule of expenditures of federal awards"
    - id: cal_candid_a133_2025
      query: "CALVARY WOMEN'S SERVICES, INC. FINANCIAL STATEMENTS SEPTEMBER 30, 2025 AND 2024"
    - id: cal_news_grants_2025
      query: "Calvary Women's Services awarded grant 2025"
      params: {max_results: 10, start_date: "2025-01-01"}
    - id: cal_news_grants_2026
      query: "Calvary Women's Services grant funding 2026 Washington DC"
      params: {max_results: 10, start_date: "2026-01-01"}
  # Calvary blog/press posts (2022-2026) that name funders; found via the WP posts API (search: grant, donation,
  # partner, foundation, award, support; after 2022-06-01). Fetched by 43; parsed with the mentions/named_lists below.
  posts:
    - id: post_2023_aura_cacia_grant
      url: "https://www.calvaryservices.org/2023/03/calvary-womens-services-receives-grant-from-aura-cacias-positive-change-project/"
      year: 2023
      mentions:
        - {name: "Aura Cacia Positive Change Project", year: 2023, pattern: "selected the organization as one of five Positive Change Project grant recipients", purpose: "2023 Positive Change Project grant for Step Up DC (employment)", amount_kind: cash, kind: "grant announcement", note: "amount not stated; Aura Cacia is a Frontier Co-op brand"}
    - id: post_2023_capital_one_poy
      url: "https://www.calvaryservices.org/2023/04/partner-of-the-year/"
      year: 2023
      mentions:
        - {name: "Capital One", year: 2022, pattern: "In 2022 alone, Capital One made significant financial investments in Calvary, led a 10-week pro bono project", purpose: "grants (financial literacy and housing programs) via the Capital One Impact Initiative, plus pro bono project and gift matching", amount_kind: mixed, kind: "partner of the year", note: "2023 Partner of the Year; amounts not stated"}
    - {id: post_2023_gala_550k, url: "https://www.calvaryservices.org/2023/05/calvary-womens-services-2023-hope-gala-raises-over-550k/", year: 2023}
    - id: post_2023_frontier_coop
      url: "https://www.calvaryservices.org/2023/05/frontier-co-op-empowers-women-at-calvary/"
      year: 2023
      mentions:
        - {name: "Frontier Co-op", year: 2023, pattern: "Frontier Co-Op generously donated over 370 items", purpose: "in-kind donation of over 370 self-care and pantry items to transitional housing sites", amount_kind: noncash, in_kind: true, kind: "in-kind donation", note: "goods donation; no value stated"}
    - id: post_2023_hogan_lovells_thanksgiving
      url: "https://www.calvaryservices.org/2023/11/gratitude-in-every-box-hogan-lovells-15-year-tradition-brightens-thanksgiving-at-calvary-womens-services/"
      year: 2023
      mentions:
        - {name: "Hogan Lovells", year: 2023, pattern: "Hogan Lovells. 15-Year Tradition", purpose: "annual Thanksgiving boxes for Calvary residents (15-year tradition)", amount_kind: noncash, in_kind: true, cumulative: true, kind: "in-kind donation", note: "in-kind tradition; also an annual Hope Gala sponsor"}
    - id: post_2023_share_fund
      url: "https://www.calvaryservices.org/2023/12/supporter-story/"
      year: 2023
      mentions:
        - {name: "Share Fund", year: 2023, pattern: "Share Fund invited Calvary Women.s Services to apply for a grant in 2012 and we.ve been proud to support them ever since", purpose: "grants since 2012 (donor-advised fund at the Greater Washington Community Foundation)", amount_kind: cash, cumulative: true, kind: "supporter story", note: "multi-year support since 2012; amounts not stated"}
    - {id: post_2023_year_review, url: "https://www.calvaryservices.org/2023/12/a-year-in-review-2023-calvary-womens-services-recap/", year: 2023}
    - id: post_2024_aura_cacia_poy
      url: "https://www.calvaryservices.org/2024/01/aura-cacia-partner-of-the-year/"
      year: 2024
      mentions:
        - {name: "Aura Cacia Positive Change Project", year: 2024, band_min: 100000, pattern: "Since 2020, Aura Cacia has gifted over \\$100,000 in grants and in-kind donations to Calvary", purpose: "grants and in-kind donations since 2020 (Step Up DC and LEAP)", amount_kind: mixed, cumulative: true, kind: "partner of the year", note: "cumulative 2020-2023 'over $100,000' stated by the recipient; 2024 Partner of the Year"}
    - {id: post_2024_gala_recap, url: "https://www.calvaryservices.org/2024/04/2024-hope-gala-recap/", year: 2024}
    - {id: post_2025_aura_cacia_thanks, url: "https://www.calvaryservices.org/2025/02/thank-you-to-aura-cacia-2024-partner-of-the-year/", year: 2025}
    - {id: post_2025_gala_thanks, url: "https://www.calvaryservices.org/2025/04/thank-you-to-everyone-who-supported-the-2025-hope-gala-on-april-23rd/", year: 2025}
    - {id: post_2025_year_review, url: "https://www.calvaryservices.org/2025/12/how-you-changed-lives-at-calvary-womens-services-in-2025/", year: 2025}
    - id: post_2026_gala_620k
      url: "https://www.calvaryservices.org/2026/05/over-620000-raised-at-calvary-womens-services-2026-hope-gala/"
      year: 2026
      mentions:
        - {name: "Biotechnology Innovation Organization (BIO)", year: 2026, pattern: "Our 2026 Partner of the Year, the Biotechnology Innovation Organization \\(BIO\\)", purpose: "2026 Partner of the Year: 'a key partner in the expansion of Calvary's programs'", kind: "partner of the year", note: "no amount stated; CRM lists BIO with 21 gifts"}
    - {id: post_2022_us_gov_funding, url: "https://www.calvaryservices.org/2022/03/calvary-womens-services-receives-significant-new-us-government-funding-to-expand-housing-services-for-vulnerable-dc-women", year: 2022}
  # per-document extraction hints for PDFs found by 43 (filled after inspecting each PDF).
  # audit.statements: [pdf_page, SFP|SOA, [[fiscal_year, W|R|T|NA, is_prior_comparative], ...]] in printed
  # column order, parsed with the Phase 1 statement parser (scripts/02_extract_inputs.parse_statement).
  documents:
    - filename: 521307706_2022_25813620221_A133.pdf
      source_id: web_calvary_fy22_audit
      fiscal_year: 2022
      note: "FY22 audit + Uniform Guidance single audit (Sept 30, 2022 and 2021), hosted by Candid (docs.candid.org/A133); not posted on calvaryservices.org."
      audit:
        statements:
          - [6, SFP, [[2022, NA, false], [2021, NA, true]]]
          - [7, SOA, [[2022, W, false], [2022, R, false], [2022, T, false]]]
          - [8, SOA, [[2021, W, true], [2021, R, true], [2021, T, true]]]
        sefa_pages: [29]
        note_pages: [12, 22]
    - filename: CWS-Audited-Financial-Statements-2014.pdf
      source_id: web_calvary_fy14_audit
      fiscal_year: 2014
      note: "FY14 audit (Sept 30, 2014, with 2013 summarized); uploaded to the WP media library, not linked from the financials page."
      audit:
        statements:
          - [5, SFP, [[2014, NA, false], [2013, NA, true]]]
          - [6, SOA, [[2014, W, false], [2014, R, false], [2014, T, false], [2013, T, true]]]
        note_pages: [10, 15]
    - filename: audited-statements-2013.pdf
      source_id: web_calvary_fy13_audit
      fiscal_year: 2013
      note: "FY13 audit; scanned image PDF with no text layer (not OCR'd, not parsed)."
    - filename: CWS-Form-990-2014.pdf
      source_id: web_calvary_990_file_2014
      note: "Form 990 PDF named '2014'; scanned image, no text layer (not parsed)."
    - filename: CWS-form-990-2013.pdf
      source_id: web_calvary_990_file_2013
      note: "Form 990 PDF named '2013'; scanned image, no text layer (not parsed)."
    - filename: Calvary-Womens-Services-2014-Annual-Report.pdf
      source_id: web_calvary_fy14_annual_report
      fiscal_year: 2014
      report_year: 2014
      note: "FY14 annual report with donor list by gift band (organizations named; individuals counted only)."
      donor_list:
        section_heading: "Corporate partners, associations, faith groups and other organizations"
        columns:  # page 6 spread, reading order; individuals continue through the right-hand columns
          - [6, [50, 140, 212, 660]]
          - [6, [212, 140, 372, 660]]
          - [6, [372, 40, 630, 720]]
          - [6, [630, 40, 790, 720]]
          - [6, [790, 40, 960, 720]]
          - [6, [960, 40, 1152, 720]]
        org_section_re: "^Corporate partners|^groups and other organizations"
        ind_section_re: "^Individuals and families"
        skip_fonts: "Georgia|Wendy"
        wrap_gap: 9.5
      mentions:
        - name: Taproot Foundation
          pattern: "pro bono grant from the Taproot Foundation"
          in_kind: true
          note: "pro bono grant (in-kind) supporting volunteer-program expansion; narrative, no amount"
    - filename: FY2013-Annual-Report-simple-version-FINAL.pdf
      source_id: web_calvary_fy13_annual_report
      fiscal_year: 2013
      report_year: 2013
      note: "FY13 annual report (simple version); no donor list, funders named in narrative only."
      mentions:
        - name: Walmart Foundation
          pattern: "generous support of the Walmart Foundation"
          note: "supported the launch of the Nutrition Education Program in 2013; no amount"
        - name: United Methodist Women
          pattern: "support from United Methodist Women"
          note: "expanded the Nutrition Education Program (financial literacy component); no amount"
    - filename: Step-Up-DC-2016-Year-End-Report.pdf
      source_id: web_calvary_step_up_dc_2016
      report_year: 2016
      note: "Step Up DC (employment program) 2016 year-end report."
      named_lists:
        - heading: "Step Up DC supporters ('supported the program this year')"
          start: "^Supporters"
          end: "Founded in 1983|Calvary Women.s Services (empowers|offers)"
          skip: "grateful for the generous|following partners supported"
          org_list: true
          note: "program funders for Step Up DC in 2016; no amounts"
    - filename: 2025-Hope-Gala-Sponsorship_CWS-2.pdf
      source_id: web_calvary_hope_gala_2025_sponsorship
      report_year: 2025
      note: "2025 Hope Gala sponsorship brochure; 'Past Event Sponsors' page (cumulative, years not stated)."
      named_lists:
        - heading: "Hope Gala: Past Event Sponsors (cumulative)"
          start: "^Past Event Sponsors"
          end: "Hope Gala Commitment Form"
          skip: "Women.s Services|Ending homelessness|^\\s*\\d+\\s*$|^\\s*Calvary\\s*$"
          org_list: true
          note: "event sponsors over past years (cumulative); no amounts or years"
    - filename: 2017-Hope-Awards-Sponsorship-Opportunities.pdf
      source_id: web_calvary_hope_awards_2017_sponsorship
      report_year: 2017
      note: "2017 Hope Awards Dinner sponsorship brochure; 'Corporate Support' page lists past sponsors."
      named_lists:
        - heading: "Hope Awards Dinner: companies that have sponsored (cumulative)"
          start: "CORPORATE SUPPORT"
          end: "HOPE AWARDS DINNER PRESS"
          skip: "Join other elite companies|have sponsored the Hope Awards|^\\s*\\d+\\s*$"
          join: {"U.S. Trust, Bank of America Private": "Wealth Management"}
          drop: ["New Partners"]
          org_list: true
          note: "event sponsors over past years (cumulative, as of early 2017); no amounts or years"

