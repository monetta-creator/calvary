# ------------------------------------------------------------------ Task 3: DMV funder grantee lists (2024-2026)
funders:
  - id: meyer
    name: "Eugene and Agnes E. Meyer Foundation"
    searches:
      - {id: fdn_meyer_1, query: "Meyer Foundation grants awarded 2025 grantees list", params: {max_results: 10}}
      - {id: fdn_meyer_2, query: "grantees 2024 2025 grant amount", params: {include_domains: [meyerfoundation.org], max_results: 15}}
      - {id: fdn_meyer_3, query: "Meyer awards grants grantee partners 2025 2026", params: {include_domains: [meyerfoundation.org], max_results: 15}}
      - {id: fdn_meyer_4, query: "grantee partners list organizations funded 2025 general operating", params: {include_domains: [meyerfoundation.org], max_results: 15}}
      - {id: fdn_meyer_5, query: "\"Meyer Foundation\" grant 2025 \"N Street Village\" OR \"Calvary Women's Services\" OR \"Miriam's Kitchen\"", params: {max_results: 10}}
    pages:
      - {id: meyer_118m_28, url: "https://meyerfoundation.org/news/meyer-awards-1-18-million-in-general-operating-grants-to-28-grantee-partners", kind: grant_list}
      - {id: meyer_635k_8, url: "https://meyerfoundation.org/news/meyer-awards-635000-to-eight-organizations-in-march", kind: grant_list}
