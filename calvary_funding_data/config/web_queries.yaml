# ------------------------------------------------------------------ Named comparators (script 46)
# Organizations named by Calvary leadership for every analysis (config/named_comparators.csv, rule NC1).
# Their funders are mostly outside the DMV funder universe, so their supporter lists and grant announcements
# naming them are pulled here. Budget for script 46: <= 30 Tavily searches and <= 15 Tavily extracts in total.
# pages: method http (direct GET, PDFs) or tavily (extract); parse specs use the script-45 parser types.
named_comparators:
  - id: dwc
    ein: "311597223"
    name: "Downtown Women's Center"
    city: "Los Angeles"
    state: "CA"
    domain: downtownwomenscenter.org
    alias: "Downtown Women.?s Cent(er|re)|^DWC$"
    searches:
      - {id: nc_dwc_ar_2025, query: "Downtown Women's Center Los Angeles 2025 annual report", params: {max_results: 10}}
      - {id: nc_dwc_ar_2024, query: "Downtown Women's Center Los Angeles 2024 annual report donors", params: {max_results: 10}}
