      - {id: nc_dwc_site_partners, query: "our partners supporters foundations corporate sponsors thank you", params: {include_domains: [downtownwomenscenter.org], max_results: 15}}
      - {id: nc_dwc_site_grants, query: "grant awarded foundation funding announcement", params: {include_domains: [downtownwomenscenter.org], max_results: 15}}
      - {id: nc_dwc_grant_2023, query: "\"Downtown Women's Center\" grant awarded foundation 2023", params: {max_results: 10, start_date: "2023-01-01"}}
      - {id: nc_dwc_grant_2024, query: "\"Downtown Women's Center\" foundation grant 2024 Skid Row", params: {max_results: 10, start_date: "2024-01-01"}}
